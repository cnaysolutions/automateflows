<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0f"/>
      <stop offset="1" stop-color="#0d0b18"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9d84ff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="15%" r="60%">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#7c5cff" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- logo lockup -->
  <g transform="translate(80,90)">
    <rect width="60" height="60" rx="16" fill="#0a0a0f" stroke="url(#grad)" stroke-width="2"/>
    <text x="30" y="40" font-family="'JetBrains Mono','Courier New',monospace" font-size="22" font-weight="700" fill="url(#grad)" text-anchor="middle">&lt;/&gt;</text>
    <text x="80" y="40" font-family="'Segoe UI',Arial,sans-serif" font-size="30" font-weight="700" fill="#f4f4f8">Automate<tspan fill="url(#grad)">Flows</tspan></text>
  </g>

  <!-- headline -->
  <text x="80" y="300" font-family="'Segoe UI',Arial,sans-serif" font-size="74" font-weight="700" fill="#f4f4f8">Stop doing manually</text>
  <text x="80" y="385" font-family="'Segoe UI',Arial,sans-serif" font-size="74" font-weight="700" fill="url(#grad)">what AI can automate</text>

  <!-- subtext -->
  <text x="80" y="455" font-family="'Segoe UI',Arial,sans-serif" font-size="28" fill="#9aa0b4">Custom AI automation for social media, content &amp; workflows.</text>

  <!-- footer row -->
  <g transform="translate(80,545)">
    <circle cx="8" cy="8" r="8" fill="#22d3ee"/>
    <text x="28" y="15" font-family="'JetBrains Mono','Courier New',monospace" font-size="24" fill="#22d3ee">automateflows.org</text>
    <text x="1040" y="15" font-family="'JetBrains Mono','Courier New',monospace" font-size="22" fill="#9aa0b4" text-anchor="end">EU based</text>
  </g>
</svg>
